# Contract C3: the top-level key MUST be exactly the SRDF planning group name.
# motion_server.launch.py merges this file with the DENSO ("arm") and Staubli
# ("manipulator") maps, so "lite6" must stay unique across the workspace.
lite6:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
  position_only_ik: false

