# ros2_control configuration, mirroring xarm_controller/config/lite6_controllers.yaml.
#
# The ros2_control block emitted by the vendor device macro declares BOTH a
# position and a velocity command interface per joint, so the trajectory
# controller has to claim both — this is the combination the vendor validates
# against UFRobotFakeSystemHardware (sim) and UFRobotSystemHardware (real).
controller_manager:
  ros__parameters:
    update_rate: 150  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lite6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

lite6_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      joint1: {trajectory: 1.0, goal: 0.01}
      joint2: {trajectory: 1.0, goal: 0.01}
      joint3: {trajectory: 1.0, goal: 0.01}
      joint4: {trajectory: 1.0, goal: 0.01}
      joint5: {trajectory: 1.0, goal: 0.01}
      joint6: {trajectory: 1.0, goal: 0.01}
    interface_name: position
    state_publish_rate: 25.0
    action_monitor_rate: 10.0
    open_loop_control: true
    allow_partial_joints_goal: false
    constraints_goal_time: 0.5
